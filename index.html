<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>3D Модель</title>


 <script type="module">
  import '@google/model-viewer/dist/model-viewer.js';
  import '@google/model-viewer-effects/dist/model-viewer-effects.js';
</script>

  <style>
    body {
      margin: 0;
      background-color: #f4f4f4;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
    }

    model-viewer {
      width: 80%;
      height: 500px;
      margin: 20px auto;
      background-color: #ffffff;
      border-radius: 12px;
    }

    .controls {
      margin: 20px;
    }

    button {
      padding: 10px 20px;
      margin: 5px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      background-color: #4CAF50;
      color: white;
    }

    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

  <h1>3D модель</h1>

 <model-viewer
  id="animatedModel"
  src="енот аним.glb"
  alt="3D модель"
  camera-controls
  autoplay
  animation-name="Idle"
  shadow-intensity="1"
  exposure="1"
  auto-rotate>

  
  <effect-composer>
    
   
    <bloom-effect
      intensity="1"
      threshold="0.3"
      smoothing="0.8">
    </bloom-effect>


    <vignette-effect
      offset="0.3"
      darkness="0.8">
    </vignette-effect>

  </effect-composer>

</model-viewer>

  <div class="controls">
    <button onclick="playAnimation('Idle')">Покачивание</button>
    <button onclick="playAnimation('Idle-Legacy Slot')">Жевание</button>
  </div>

  <script>
    const model = document.getElementById("animatedModel");

    function playAnimation(animationName) {
      model.animationName = animationName;
      model.play();
    }
  </script>

</body>
</html>
