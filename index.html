<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>3D Модель</title>

 
  <script async src="https://ga.jspm.io/npm:es-module-shims@1.7.1/dist/es-module-shims.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@^0.172.0/build/three.module.min.js"
    }
  }
  </script>

  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer-module.min.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer-effects/dist/model-viewer-effects.min.js"></script>

  <style>
    body { margin: 0; background: #f4f4f4; text-align: center; font-family: Arial, sans-serif; }
    model-viewer { width: 80%; height: 500px; margin: 20px auto; background: #fff; border-radius: 12px; }
    button { padding: 10px 20px; margin: 5px; font-size: 16px; cursor: pointer; border: none; border-radius: 8px; background: #4CAF50; color: white; }
    button:hover { background: #45a049; }
  </style>
</head>
<body>

  <h1>3D модель</h1>

  <model-viewer
    id="animatedModel"
    src="енот аним.glb"
    alt="3D модель"
    camera-controls
    autoplay
    animation-name="Idle"
    shadow-intensity="1"
    exposure="1"
    auto-rotate>


    <effect-composer id="composer">
      <bloom-effect id="bloom" blend-mode="skip"></bloom-effect>
      <outline-effect id="outline" color="red" blend-mode="skip"></outline-effect>
      <color-grade-effect></color-grade-effect>
    </effect-composer>

  </model-viewer>

  <div class="controls">
    <button onclick="playWithBloom('Idle')">Покачивание</button>
    <button onclick="playWithOutline('Idle-Legacy Slot')">Жевание</button>
  </div>

  <script>
    const model = document.getElementById("animatedModel");
    const bloom = document.getElementById("bloom");
    const outline = document.getElementById("outline");

    function playWithBloom(anim) {
      model.animationName = anim;
      model.play();
      bloom.setAttribute("blend-mode", "default");    
      outline.setAttribute("blend-mode", "skip");      
    }

    function playWithOutline(anim) {
      model.animationName = anim;
      model.play();
      outline.setAttribute("blend-mode", "default");  
      bloom.setAttribute("blend-mode", "skip");        
    }
  </script>

</body>
</html>
