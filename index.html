<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>3D Модель с Post-Processing</title>

  <!-- Model Viewer -->
  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      background: #111;
      font-family: Arial, sans-serif;
      text-align: center;
      color: white;
    }

    model-viewer {
      width: 90%;
      height: 600px;
      margin-top: 20px;
      --poster-color: transparent;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>3D Модель</h2>

<model-viewer
  id="model"
  src="енот аним.glb"
  camera-controls
  autoplay
  auto-rotate
  shadow-intensity="1"
  exposure="1.2"
  environment-image="neutral"
>
</model-viewer>

<div>
  <button onclick="enableBloom()">Bloom</button>
  <button onclick="enableColorGrading()">Color Grading</button>
  <button onclick="resetEffects()">Reset</button>
</div>

<script>
  const model = document.querySelector("#model");

  function enableBloom() {
    model.style.setProperty('--model-viewer-bloom-intensity', '1.5');
    model.style.setProperty('--model-viewer-bloom-threshold', '0.8');
  }

  function enableColorGrading() {
    model.style.setProperty('--model-viewer-tone-mapping', 'aces');
    model.style.setProperty('--model-viewer-exposure', '1.5');
  }

  function resetEffects() {
    model.style.removeProperty('--model-viewer-bloom-intensity');
    model.style.removeProperty('--model-viewer-bloom-threshold');
    model.style.removeProperty('--model-viewer-tone-mapping');
    model.style.removeProperty('--model-viewer-exposure');
  }
</script>

</body>
</html>
