<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>3D Модель</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      background-color: #f4f4f4;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
    }

    model-viewer {
      width: 80%;
      height: 500px;
      margin: 20px auto;
      background-color: #ffffff;
      border-radius: 12px;
    }

    .controls {
      margin: 20px;
    }

    button {
      padding: 10px 20px;
      margin: 5px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      background-color: #4CAF50;
      color: white;
    }

    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

  <h1>3D модель</h1>

  <model-viewer
    id="animatedModel"
    src="енот аним.glb"
    alt="3D модель"
    camera-controls
    autoplay
    animation-name="Idle"
    shadow-intensity="1"
    exposure="1"
    auto-rotate
    postprocessing>
  </model-viewer>

  <div class="controls">
    <button onclick="playAnimationWithBloom('Idle')">Покачивание</button>
    <button onclick="playAnimationWithOutline('Idle-Legacy Slot')">Жевание</button>
  </div>

  <script>
    const model = document.getElementById("animatedModel");

    let bloomEffect = null;
    let outlineEffect = null;

    model.addEventListener('load', () => {
    
      model.postprocessing = true;

     
      bloomEffect = model.scene.addPostProcessEffect('bloom', {
        intensity: 1.0,
        threshold: 0.8
      });
      outlineEffect = model.scene.addPostProcessEffect('outline', {
        edgeColor: 0xff0000,
        edgeWidth: 0.03
      });


      bloomEffect.enabled = false;
      outlineEffect.enabled = false;
    });

    function playAnimationWithBloom(animationName) {
      model.animationName = animationName;
      model.play();
     
      bloomEffect.enabled = true;
      outlineEffect.enabled = false;
    }

    function playAnimationWithOutline(animationName) {
      model.animationName = animationName;
      model.play();
      
      outlineEffect.enabled = true;
      bloomEffect.enabled = false;
    }
  </script>

</body>
</html>
